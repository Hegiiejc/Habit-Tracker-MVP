<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер Привычек MVP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; color: white; margin-bottom: 30px; }
        header h1 { font-size: 2.5em; }
        .stats { display: flex; justify-content: space-around; background: white; padding: 25px; border-radius: 15px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .stat-item { text-align: center; }
        .stat-number { font-size: 2.2em; font-weight: bold; color: #667eea; }
        .stat-label { color: #666; font-size: 0.9em; margin-top: 5px; }
        .card { background: white; padding: 25px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .habit-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .habit-name { font-size: 1.5em; font-weight: 600; }
        .streak { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; padding: 8px 15px; border-radius: 20px; font-weight: bold; }
        .habit-meta { color: #888; margin: 10px 0 20px; }
        .actions { display: flex; gap: 10px; }
        .btn { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; color: white; font-size: 1em; }
        .btn-check { background: linear-gradient(135deg, #11998e, #38ef7d); flex: 1; }
        .btn-check:disabled { background: #ccc; cursor: not-allowed; }
        .btn-archive { background: #ff6b6b; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #555; font-weight: 500; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1em; }
        .btn-add { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 12px 30px; border: none; border-radius: 8px; cursor: pointer; font-size: 1em; }
        .empty { text-align: center; color: white; padding: 50px; font-size: 1.2em; background: rgba(255,255,255,0.1); border-radius: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 Трекер Привычек</h1>
            <p id="current-date"></p>
        </header>

        <div class="stats">
            <div class="stat-item"><div class="stat-number" id="total-habits">0</div><div class="stat-label">Активных привычек</div></div>
            <div class="stat-item"><div class="stat-number" id="completed-today">0</div><div class="stat-label">Выполнено сегодня</div></div>
            <div class="stat-item"><div class="stat-number" id="best-streak">0</div><div class="stat-label">Лучший стрик</div></div>
        </div>

        <div class="card">
            <h2 style="margin-bottom: 20px;">➕ Добавить привычку</h2>
            <form id="add-form">
                <div class="form-group"><label>Название</label><input type="text" id="name" required placeholder="Например: Читать 30 минут"></div>
                <div class="form-group"><label>Описание</label><textarea id="desc" rows="2"></textarea></div>
                <div class="form-group"><label>Периодичность</label><select id="freq"><option value="daily">Ежедневно</option><option value="weekly">Еженедельно</option></select></div>
                <div class="form-group"><label>Время</label><input type="time" id="time" value="09:00"></div>
                <button type="submit" class="btn-add">Добавить</button>
            </form>
        </div>

        <div id="habits-list"></div>
    </div>

    <script>
        const STORAGE_KEY = 'habit_tracker_data';
        
        function loadData() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { habits: [], entries: [] };
        }

        function saveData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            render();
        }

        function getToday() {
            return new Date().toISOString().split('T')[0];
        }

        function calculateStreak(entries, habitId) {
            const done = entries.filter(e => e.habit_id === habitId && e.status === 'done')
                               .sort((a, b) => b.date.localeCompare(a.date));
            let streak = 0;
            for (let i = 0; i < done.length; i++) {
                const expected = new Date();
                expected.setDate(expected.getDate() - i);
                if (done[i].date === expected.toISOString().split('T')[0]) {
                    streak++;
                } else break;
            }
            return streak;
        }

        function render() {
            const data = loadData();
            const today = getToday();
            const list = document.getElementById('habits-list');
            list.innerHTML = '';

            let totalActive = 0, completedToday = 0, bestStreak = 0;

            data.habits.forEach(habit => {
                if (!habit.is_active) return;
                totalActive++;
                const streak = calculateStreak(data.entries, habit.id);
                bestStreak = Math.max(bestStreak, streak);
                const isDoneToday = data.entries.some(e => e.habit_id === habit.id && e.date === today && e.status === 'done');
                if (isDoneToday) completedToday++;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="habit-header">
                        <div class="habit-name">${habit.name}</div>
                        <div class="streak">🔥 ${streak} дн.</div>
                    </div>
                    <div>${habit.description}</div>
                    <div class="habit-meta">${habit.frequency === 'daily' ? '📅 Ежедневно' : '📆 Еженедельно'} &nbsp; ⏰ ${habit.target_time}</div>
                    <div class="actions">
                        <button class="btn btn-check" onclick="checkIn(${habit.id})" ${isDoneToday ? 'disabled' : ''}>
                            ${isDoneToday ? '✅ Выполнено' : '✓ Отметить'}
                        </button>
                        <button class="btn btn-archive" onclick="archiveHabit(${habit.id})">📦 В архив</button>
                    </div>
                `;
                list.appendChild(card);
            });

            if (totalActive === 0) {
                list.innerHTML = '<div class="empty"> У вас пока нет привычек. Добавьте первую!</div>';
            }

            document.getElementById('total-habits').textContent = totalActive;
            document.getElementById('completed-today').textContent = completedToday;
            document.getElementById('best-streak').textContent = bestStreak;
            document.getElementById('current-date').textContent = 'Сегодня: ' + new Date().toLocaleDateString('ru-RU');
        }

        document.getElementById('add-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const data = loadData();
            data.habits.push({
                id: Date.now(),
                name: document.getElementById('name').value,
                description: document.getElementById('desc').value,
                frequency: document.getElementById('freq').value,
                target_time: document.getElementById('time').value,
                is_active: true
            });
            saveData(data);
            e.target.reset();
        });

        window.checkIn = function(id) {
            const data = loadData();
            const note = prompt('Заметка (необязательно):');
            data.entries.push({ habit_id: id, date: getToday(), status: 'done', note: note || '' });
            saveData(data);
        };

        window.archiveHabit = function(id) {
            if (!confirm('Отправить в архив?')) return;
            const data = loadData();
            const habit = data.habits.find(h => h.id === id);
            if (habit) habit.is_active = false;
            saveData(data);
        };

        render();
    </script>
</body>
</html>
